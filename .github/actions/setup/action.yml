name: setup
description: Common CI setup

runs:
    using: composite
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
              node-version: 18
              cache: yarn

        - name: Set up Rust
          uses: dtolnay/rust-toolchain@stable
