name: setup
description: Common CI setup

runs:
    using: composite
    steps:
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
              node-version: 22
              cache: npm

        - name: Set up Rust
          uses: dtolnay/rust-toolchain@stable

        - name: Cache Rust artifacts
          uses: Swatinem/rust-cache@v2
          with:
              workspaces: ". -> target"
