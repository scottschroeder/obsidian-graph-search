name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve tag
              id: tag
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  else
                    echo "Tag '$tag' does not match X.Y.Z; failing release."
                    exit 1
                  fi

            - name: Find CI run for tag
              id: ci
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  sha=$(git rev-list -n 1 "${{ steps.tag.outputs.tag }}")
                  echo "Looking for CI run for $sha"
                  for i in $(seq 1 40); do
                    run_json=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?per_page=50" \
                      --jq "[.workflow_runs[] | select(.head_sha == \"$sha\")][0]")
                    run_id=$(echo "$run_json" | jq -r '.id // empty')
                    if [ -n "$run_id" ]; then
                      status=$(echo "$run_json" | jq -r '.status')
                      conclusion=$(echo "$run_json" | jq -r '.conclusion')
                      if [ "$status" = "completed" ]; then
                        if [ "$conclusion" = "success" ]; then
                          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                          exit 0
                        fi
                        echo "CI run $run_id completed with $conclusion"
                        exit 1
                      fi
                    fi
                    sleep 15
                  done
                  echo "Timed out waiting for CI run for $sha"
                  exit 1

            - uses: ./.github/actions/setup

            - name: Install dependencies
              run: npm ci

            - name: Build plugin
              run: npm run build

            - name: Verify build artifacts
              run: |
                  test -f main.js
                  test -f manifest.json
                  test -f styles.css

            - name: Prepare release bundle
              run: |
                  rm -rf release
                  mkdir -p release/graph-search
                  cp main.js manifest.json styles.css release/graph-search/
                  (cd release && zip -r "graph-search-${{ steps.tag.outputs.tag }}.zip" graph-search)

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${{ steps.tag.outputs.tag }}"
                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    main.js manifest.json styles.css \
                    "release/graph-search-${{ steps.tag.outputs.tag }}.zip"
