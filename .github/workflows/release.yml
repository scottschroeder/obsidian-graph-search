name: Release Obsidian plugin

on:
    workflow_run:
        workflows: ["CI"]
        types:
            - completed

jobs:
    release:
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve tag
              id: tag
              run: |
                  tag=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
                  if [ -z "$tag" ]; then
                    echo "No semver tag found for this run; skipping release."
                    echo "is_release=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "is_release=true" >> "$GITHUB_OUTPUT"

            - name: Download build artifacts
              if: steps.tag.outputs.is_release == 'true'
              uses: actions/download-artifact@v4
              with:
                  name: plugin-build
                  run-id: ${{ github.event.workflow_run.id }}
                  path: ./artifact

            - name: Prepare release bundle
              if: steps.tag.outputs.is_release == 'true'
              run: |
                  rm -rf release
                  mkdir -p release/graph-search
                  cp artifact/main.js artifact/manifest.json artifact/styles.css release/graph-search/
                  (cd release && zip -r "graph-search-${{ steps.tag.outputs.tag }}.zip" graph-search)

            - name: Create release
              if: steps.tag.outputs.is_release == 'true'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${{ steps.tag.outputs.tag }}"
                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    artifact/main.js artifact/manifest.json artifact/styles.css \
                    "release/graph-search-${{ steps.tag.outputs.tag }}.zip"
