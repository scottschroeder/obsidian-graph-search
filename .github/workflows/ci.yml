name: CI

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    wasm-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - name: Verify committed WASM hash
              run: cargo run --package xtask -- wasm check

    wasm-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - name: Install wasm-pack
              uses: taiki-e/install-action@v2
              with:
                  tool: wasm-pack
            - name: Build WASM artifacts
              run: cargo run --package xtask -- wasm build

    fmt:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - name: Install dependencies
              run: yarn install --frozen-lockfile
            - name: Run formatters
              run: yarn run fmt
            - name: Verify formatting
              run: |
                  if ! git diff --quiet; then
                    echo "Formatting changed files:"
                    git diff
                    git diff --name-only
                    exit 1
                  fi

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - name: Install dependencies
              run: yarn install --frozen-lockfile
            - name: Run Rust lints
              run: cargo clippy
            - name: Run JS lints
              run: yarn run lint

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - name: Install dependencies
              run: yarn install --frozen-lockfile
            - name: Run Rust tests
              run: cargo test
            - name: Run JS tests
              run: yarn test

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - name: Install dependencies
              run: yarn install --frozen-lockfile
            - name: Build plugin
              run: yarn build
            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: plugin-build
                  path: |
                      main.js
                      manifest.json
                      styles.css
                  if-no-files-found: error
