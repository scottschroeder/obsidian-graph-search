[package]
name = "obsidian-rust-plugin"
version = "0.4.5"
authors = ["Stephen Solka <solka@angel.co>"]
description = "Graph-aware Obsidian search with proximity scoring."
repository = "https://github.com/scottschroeder/obsidian-graph-search"
license = "MIT"
edition = "2018"

[workspace]
members = [".", "xtask"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.88"
js-sys = "0.3.65"
petgraph = "0.8.3"
hashbrown = "0.15.5"
serde = { version = "1.0.196", features = ["derive"] }
serde-wasm-bindgen = "0.6.3"
serde_json = "1.0.113"
